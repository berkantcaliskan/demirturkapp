name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Check Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run application tests
        run: flutter test

      - name: Prepare production signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Production signing key is required"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/demirturk.p12"
          chmod 600 "$RUNNER_TEMP/demirturk.p12"

      - name: Build Android APK
        env:
          DEMIRTURK_KEYSTORE_PATH: ${{ runner.temp }}/demirturk.p12
          DEMIRTURK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEMIRTURK_KEY_ALIAS: demirturk
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: demirturkapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
