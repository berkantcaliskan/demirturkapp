name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Build version 10 APK
        run: flutter build apk --release --build-name=1.0.10 --build-number=10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: demirturkapp-v10-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
